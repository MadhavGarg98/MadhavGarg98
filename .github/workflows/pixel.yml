name: Add a visitor pixel

# Runs when someone opens an issue whose title starts with "Add my pixel"
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  claim:
    if: startsWith(github.event.issue.title, 'Add my pixel') && github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_USER: ${{ github.event.issue.user.login }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: Place the pixel and save it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python scripts/claim_pixel.py
            git add data assets
            if git diff --cached --quiet; then break; fi
            git commit -m "pixel: add @${ISSUE_USER}"
            if git push origin "HEAD:$BRANCH"; then break; fi
            sleep $((RANDOM % 6 + 2))
          done

      - name: Reply and close the issue
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file result.txt
          gh issue close "$ISSUE_NUMBER" --reason completed
